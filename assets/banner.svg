<svg width="1000" height="200" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="200" rx="14" fill="url(#bg)"/>

  <!-- subtle node/graph motif on the right, nodding to "agent memory" -->
  <g stroke="#475569" stroke-width="1.5" opacity="0.6">
    <line x1="760" y1="60" x2="840" y2="40"/>
    <line x1="840" y1="40" x2="910" y2="75"/>
    <line x1="840" y1="40" x2="820" y2="110"/>
    <line x1="760" y1="60" x2="820" y2="110"/>
    <line x1="820" y1="110" x2="900" y2="140"/>
    <line x1="760" y1="60" x2="700" y2="120"/>
    <line x1="700" y1="120" x2="820" y2="110"/>
  </g>
  <g fill="#38bdf8">
    <circle cx="760" cy="60" r="5"/>
    <circle cx="840" cy="40" r="5"/>
    <circle cx="700" cy="120" r="4"/>
  </g>
  <g fill="#818cf8">
    <circle cx="910" cy="75" r="5"/>
    <circle cx="820" cy="110" r="6"/>
    <circle cx="900" cy="140" r="4"/>
  </g>

  <text x="50" y="92" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#f8fafc">
    Aniruddha Stark
  </text>
  <text x="50" y="128" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#cbd5e1">
    Building AI developer tooling — agent memory, MCP servers, and the backend underneath it
  </text>
  <text x="50" y="160" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8">
    IBM · Bangalore, India
  </text>

  <rect x="50" y="172" width="46" height="4" rx="2" fill="url(#accent)"/>
</svg>
